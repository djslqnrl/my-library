<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Personal Bookshelf</title>
    <style>
        :root { 
            --shelf-wood: #5d4037; 
            --shelf-shadow: #3e2723;
            --bg-wall: #f4f1ea;
            --accent-green: #2e7d32;
            --accent-brown: #4a3f35;
        }
        body { 
            font-family: -apple-system, sans-serif; 
            background: var(--bg-wall); 
            margin: 0; padding: 20px; 
            padding-bottom: 150px; /* Space for stacked buttons */
        }
        
        h1 { text-align: center; color: var(--shelf-wood); margin-top: 40px; margin-bottom: 30px; font-weight: 300; letter-spacing: 1px; }

        /* The Shelf Styling */
        .shelf-container { 
            display: flex; flex-wrap: wrap; 
            gap: 45px 0; justify-content: center; 
            max-width: 600px; margin: auto;
        }
        .shelf { 
            width: 100%; border-bottom: 16px solid var(--shelf-wood); 
            box-shadow: 0 10px 15px rgba(0,0,0,0.1);
            display: flex; align-items: flex-end; 
            padding: 0 10px; min-height: 120px;
            position: relative;
        }

        /* The Book Spines */
        .book {
            width: 32px; height: 100px;
            margin-right: 4px; border-radius: 3px 3px 0 0;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            transition: transform 0.2s; position: relative;
            box-shadow: inset -4px 0 6px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .book:active { transform: scale(0.95); }
        .book-title {
            writing-mode: vertical-rl; text-orientation: mixed;
            font-size: 10px; color: white; font-weight: bold;
            overflow: hidden; max-height: 85px; text-align: center;
            pointer-events: none;
        }

        /* Modals */
        #modal, #listModal, #detailModal { 
            display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            background: white; padding: 25px; border-radius: 20px; 
            box-shadow: 0 15px 40px rgba(0,0,0,0.3); width: 85%; max-width: 400px; 
            z-index: 10; max-height: 80vh; overflow-y: auto; 
        }
        .overlay { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); z-index: 5; 
        }

        input, textarea { 
            width: 100%; margin: 8px 0; padding: 12px; box-sizing: border-box; 
            border: 1px solid #ddd; border-radius: 10px; font-size: 16px; 
        }
        .btn-main { background: var(--shelf-wood); color: white; border: none; padding: 15px; width: 100%; border-radius: 12px; font-weight: bold; margin-top: 10px; }

        /* Floating Action Buttons (Stacked Bottom Right) */
        .fab-container {
            position: fixed; bottom: 25px; right: 20px;
            display: flex; flex-direction: column; gap: 12px; z-index: 4;
        }
        .fab {
            padding: 15px 20px; border-radius: 50px; color: white; border: none;
            font-weight: bold; box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            display: flex; align-items: center; justify-content: center;
            font-size: 14px; text-decoration: none;
        }
        .add-fab { background: var(--accent-green); }
        .list-fab { background: var(--accent-brown); }

        .close-x { float: right; font-size: 28px; border: none; background: none; cursor: pointer; color: #bbb; margin-top: -10px; }
        .delete-btn { color: #e74c3c; font-size: 0.85rem; cursor: pointer; float: right; font-weight: bold; }
        
        .detail-row { margin-bottom: 10px; font-size: 0.95rem; }
        .detail-label { color: #888; font-size: 0.8rem; display: block; }
    </style>
</head>
<body>

<h1>My Library</h1>

<div class="shelf-container" id="shelves"></div>

<div class="fab-container">
    <button class="fab add-fab" onclick="openModal('modal')">＋ Add Book</button>
    <button class="fab list-fab" onclick="openListModal()">📋 View List</button>
</div>

<div class="overlay" id="overlay" onclick="closeModals()"></div>

<div id="modal">
    <button class="close-x" onclick="closeModals()">×</button>
    <h3 style="margin-top:0">Archive New Book</h3>
    <input type="text" id="title" placeholder="Book Title">
    <input type="text" id="writer" placeholder="Writer">
    <input type="text" id="translator" placeholder="Translator (optional)">
    <input type="text" id="publisher" placeholder="Publishing Company">
    <input type="date" id="readDate">
    <textarea id="review" placeholder="Your Review..." rows="4"></textarea>
    <button class="btn-main" onclick="saveBook()">Place on Shelf</button>
</div>

<div id="listModal">
    <button class="close-x" onclick="closeModals()">×</button>
    <h3 style="margin-top:0">Reading History</h3>
    <div id="historyContent"></div>
</div>

<div id="detailModal">
    <button class="close-x" onclick="closeModals()">×</button>
    <h3 id="detTitle" style="color:var(--shelf-wood); margin-bottom:15px;"></h3>
    <div class="detail-row"><span class="detail-label">Writer</span><span id="detWriter"></span></div>
    <div class="detail-row"><span class="detail-label">Translator</span><span id="detTranslator"></span></div>
    <div class="detail-row"><span class="detail-label">Publisher</span><span id="detPublisher"></span></div>
    <div class="detail-row"><span class="detail-label">Read Date</span><span id="detDate"></span></div>
    <div class="detail-row" style="margin-top:15px; border-top:1px solid #eee; padding-top:10px;"><span class="detail-label">My Review</span><p id="detReview" style="font-style:italic; line-height:1.5"></p></div>
</div>

<script>
    let library = JSON.parse(localStorage.getItem('myLibrary')) || [];
    const colors = ['#264653', '#2a9d8f', '#e9c46a', '#f4a261', '#e76f51', '#6d597a', '#b56576', '#457b9d', '#2c3e50', '#8e44ad'];

    function saveBook() {
        const title = document.getElementById('title').value;
        if(!title) return;

        const book = {
            id: Date.now(),
            title: title,
            writer: document.getElementById('writer').value,
            translator: document.getElementById('translator').value || '-',
            publisher: document.getElementById('publisher').value,
            readDate: document.getElementById('readDate').value,
            review: document.getElementById('review').value,
            color: colors[Math.floor(Math.random() * colors.length)]
        };

        library.push(book);
        localStorage.setItem('myLibrary', JSON.stringify(library));
        renderShelf();
        closeModals();
        document.querySelectorAll('input, textarea').forEach(i => i.value = '');
    }

    function renderShelf() {
        const container = document.getElementById('shelves');
        container.innerHTML = '';
        
        let shelfCount = Math.ceil(library.length / 10) || 1;
        for (let i = 0; i < shelfCount; i++) {
            const shelfDiv = document.createElement('div');
            shelfDiv.className = 'shelf';
            
            const shelfBooks = library.slice(i * 10, (i + 1) * 10);
            shelfBooks.forEach(book => {
                const bookDiv = document.createElement('div');
                bookDiv.className = 'book';
                bookDiv.style.backgroundColor = book.color;
                bookDiv.innerHTML = `<div class="book-title">${book.title}</div>`;
                bookDiv.onclick = () => showBookDetails(book);
                shelfDiv.appendChild(bookDiv);
            });
            container.appendChild(shelfDiv);
        }
    }

    function showBookDetails(book) {
        document.getElementById('detTitle').innerText = book.title;
        document.getElementById('detWriter').innerText = book.writer;
        document.getElementById('detTranslator').innerText = book.translator;
        document.getElementById('detPublisher').innerText = book.publisher;
        document.getElementById('detDate').innerText = book.readDate;
        document.getElementById('detReview').innerText = book.review || "No review left.";
        
        openModal('detailModal');
    }

    function openModal(id) {
        document.getElementById(id).style.display = 'block';
        document.getElementById('overlay').style.display = 'block';
    }

    function openListModal() {
        const content = document.getElementById('historyContent');
        content.innerHTML = library.map(b => `
            <div style="border-bottom: 1px solid #eee; padding: 12px 0;">
                <span class="delete-btn" onclick="deleteBook(${b.id})">Delete</span>
                <div onclick='showBookDetails(${JSON.stringify(b).replace(/'/g, "&apos;")})'>
                    <strong>${b.title}</strong><br>
                    <small style="color:#666">${b.writer} | ${b.readDate}</small>
                </div>
            </div>
        `).join('') || "Your bookshelf is empty.";
        openModal('listModal');
    }

    function deleteBook(id) {
        if(!confirm("Remove this book from your shelves?")) return;
        library = library.filter(b => b.id !== id);
        localStorage.setItem('myLibrary', JSON.stringify(library));
        renderShelf();
        openListModal();
    }

    function closeModals() {
        document.getElementById('modal').style.display = 'none';
        document.getElementById('listModal').style.display = 'none';
        document.getElementById('detailModal').style.display = 'none';
        document.getElementById('overlay').style.display = 'none';
    }

    renderShelf();
</script>

</body>
</html>
